apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-backend-config
  namespace: super-erp
data:
  PORT: "5000"
  NODE_ENV: "production"
  CLIENT_URL: "http://super-erp.local"
  ENABLE_CRON_JOBS: "true"
  SHUTDOWN_TIMEOUT_MS: "10000"
  DISBURSEMENT_LIVE_MODE: "false"
  FAWRY_ENV: "sandbox"
  INSTAPAY_BASE_URL: "https://sandbox.instapay.eg/api"
