name: Docker Build and Push to Amazon ECR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  docker-build-push:
    name: Build & Push Docker Images to Amazon ECR
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

    steps:
      # Step 1: Checkout repository using latest stable action
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx engine using latest stable action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Configure AWS Credentials using Keyless GitHub OIDC
      - name: Configure AWS Credentials (OIDC)
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 4: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5: Extract Docker Metadata for Backend & Frontend
      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry != '' && format('{0}/core360-backend', steps.login-ecr.outputs.registry) || 'core360-backend' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-

      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry != '' && format('{0}/core360-frontend', steps.login-ecr.outputs.registry) || 'core360-frontend' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-

      # Step 6: Build & Push Backend Docker Image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Super-ERP-backend
          file: ./Super-ERP-backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.AWS_ROLE_TO_ASSUME != '' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # Step 7: Build & Push Frontend Docker Image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Super-ERP-frontend
          file: ./Super-ERP-frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.AWS_ROLE_TO_ASSUME != '' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # Step 8: Save Build Metadata Artifact
      - name: Upload Docker Build Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-metadata
          path: |
            ${{ steps.meta-backend.outputs.json }}
            ${{ steps.meta-frontend.outputs.json }}
          if-no-files-found: ignore
          retention-days: 7
