name: Docker Build and Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      # Step 1: Checkout repository using latest stable action
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx engine using latest stable action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub (if secrets provided)
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Extract Docker Metadata (Tags & Labels)
      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY || 'docker.io' }}/${{ secrets.IMAGE_PREFIX || secrets.DOCKERHUB_USERNAME || 'core360' }}/core360-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-

      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY || 'docker.io' }}/${{ secrets.IMAGE_PREFIX || secrets.DOCKERHUB_USERNAME || 'core360' }}/core360-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-

      # Step 5: Build & Push Backend Docker Image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Super-ERP-backend
          file: ./Super-ERP-backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # Step 6: Build & Push Frontend Docker Image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Super-ERP-frontend
          file: ./Super-ERP-frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # Step 7: Save Build Metadata Artifact
      - name: Upload Docker Build Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-metadata
          path: |
            ${{ steps.meta-backend.outputs.json }}
            ${{ steps.meta-frontend.outputs.json }}
          if-no-files-found: ignore
          retention-days: 7
