name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Super-ERP-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Super-ERP-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-crm-module:
    name: Migrate CRM module
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'refactor/frontend-crm' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRM branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrate CRM implementation files
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('Super-ERP-frontend/src')
          source_probe = root / 'pages' / 'LeadsPage.jsx'
          if not source_probe.exists():
              print('CRM implementation already migrated; nothing to do.')
              raise SystemExit(0)

          moves = {
              'leads': ['LeadsPage.jsx', 'LeadDistributionPage.jsx', 'LeadDetailsPage.jsx'],
              'campaigns': ['CampaignsPage.jsx', 'CampaignFormPage.jsx'],
              'offers': ['OfferDetailPage.jsx'],
              'sales': ['SalesKanbanPage.jsx', 'ExecutiveDashboardPage.jsx'],
              'bookings': ['BookingLookupPage.jsx'],
              'analytics': ['AnalyticsPage.jsx'],
              'tickets': ['TicketsPage.jsx'],
              'email': ['EmailsPage.jsx', 'SentEmailsPage.jsx', 'EmailComposer.jsx'],
          }

          crm_root = root / 'modules' / 'crm' / 'features'
          for feature, filenames in moves.items():
              destination = crm_root / feature
              destination.mkdir(parents=True, exist_ok=True)
              for filename in filenames:
                  source = root / 'pages' / filename
                  target = destination / filename
                  if source.exists() and not target.exists():
                      source.rename(target)

          support_moves = {
              'OfferHistoryModal.jsx': crm_root / 'offers' / 'components' / 'OfferHistoryModal.jsx',
              'OfferVersionsModal.jsx': crm_root / 'offers' / 'components' / 'OfferVersionsModal.jsx',
              'offerHelpers.js': crm_root / 'offers' / 'utils' / 'offerHelpers.js',
          }
          for filename, target in support_moves.items():
              source = root / ('components' if filename.endswith('.jsx') else 'utils') / filename
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.exists() and not target.exists():
                  source.rename(target)

          for feature_dir in crm_root.iterdir():
              if not feature_dir.is_dir():
                  continue
              for path in feature_dir.rglob('*.jsx'):
                  text = path.read_text()
                  text = text.replace("from '../context/", "from '../../../../context/")
                  text = text.replace("from '../services/", "from '../../../../services/")
                  text = text.replace("from '../components/", "from '../../../../components/")
                  text = text.replace("from '../utils/", "from '../../../../utils/")
                  text = text.replace("from '../pages/", "from '../../../../pages/")
                  path.write_text(text)

          leads_details = crm_root / 'leads' / 'LeadDetailsPage.jsx'
          if leads_details.exists():
              text = leads_details.read_text()
              text = text.replace("from './EmailComposer'", "from '../email/EmailComposer'")
              text = text.replace("from '../../../../components/OfferHistoryModal'", "from '../offers/components/OfferHistoryModal'")
              text = text.replace("from '../../../../components/OfferVersionsModal'", "from '../offers/components/OfferVersionsModal'")
              text = text.replace("from '../../../../utils/offerHelpers'", "from '../offers/utils/offerHelpers'")
              leads_details.write_text(text)

          app = root / 'App.jsx'
          text = app.read_text()
          import_map = {
              'LeadsPage': 'leads/LeadsPage', 'LeadDistributionPage': 'leads/LeadDistributionPage',
              'LeadDetailsPage': 'leads/LeadDetailsPage', 'OfferDetailPage': 'offers/OfferDetailPage',
              'BookingLookupPage': 'bookings/BookingLookupPage', 'TicketsPage': 'tickets/TicketsPage',
              'AnalyticsPage': 'analytics/AnalyticsPage', 'SalesKanbanPage': 'sales/SalesKanbanPage',
              'ExecutiveDashboardPage': 'sales/ExecutiveDashboardPage', 'CampaignsPage': 'campaigns/CampaignsPage',
              'CampaignFormPage': 'campaigns/CampaignFormPage', 'EmailsPage': 'email/EmailsPage',
              'SentEmailsPage': 'email/SentEmailsPage', 'EmailComposer': 'email/EmailComposer',
          }
          for name, module_path in import_map.items():
              text = re.sub(rf"import {name} from './pages/{re.escape(name)}';", f"import {name} from './modules/crm/features/{module_path}';", text)
          app.write_text(text)

          for feature, filenames in moves.items():
              lines = [f"export {{ default as {filename.replace('.jsx', '')} }} from './{filename}';" for filename in filenames]
              (crm_root / feature / 'index.js').write_text('\n'.join(lines) + '\n')

          root_index = root / 'modules' / 'crm' / 'index.js'
          root_index.write_text('\n'.join([
              "export * from './features/leads';", "export * from './features/campaigns';",
              "export * from './features/offers';", "export * from './features/sales';",
              "export * from './features/bookings';", "export * from './features/analytics';",
              "export * from './features/tickets';", "export * from './features/email';", '',
          ]))

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '.'], check=True)
          result = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, check=True)
          if not result.stdout.strip():
              raise SystemExit('CRM migration produced no changes')
          subprocess.run(['git', 'commit', '-m', 'refactor(frontend): migrate CRM implementation files'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refactor/frontend-crm'], check=True)

  build-and-lint:
    name: Build Frontend
    needs: migrate-crm-module
    if: ${{ always() && (needs.migrate-crm-module.result == 'success' || needs.migrate-crm-module.result == 'skipped') }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Super-ERP-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Super-ERP-frontend/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Super-ERP-frontend/dist
          retention-days: 7
