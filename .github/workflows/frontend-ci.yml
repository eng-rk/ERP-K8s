name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Super-ERP-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Super-ERP-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Super-ERP-frontend

    steps:
      # Step 1: Checkout repository using latest stable action
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 22 LTS environment with npm dependency caching
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Super-ERP-frontend/package-lock.json'

      # Step 3: Clean install frontend dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build frontend
      - name: Build frontend
        run: npm run build

      # Step 5: Upload dist artifact
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Super-ERP-frontend/dist
          retention-days: 7
