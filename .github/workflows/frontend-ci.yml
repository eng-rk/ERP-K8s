name: Frontend CI

# Workflow triggers: Runs on push or PR affecting frontend code
on:
  push:
    paths:
      - 'Super-ERP-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'Super-ERP-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-lint:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Super-ERP-frontend

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js LTS environment with npm dependency caching
      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'Super-ERP-frontend/package-lock.json'

      # Step 3: Install frontend dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run frontend build
      - name: Build frontend
        run: npm run build

      # Step 5: Upload dist artifact
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Super-ERP-frontend/dist
          retention-days: 7
