name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Kubernetes Cluster
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main') }}
    environment:
      name: production
      url: ${{ vars.ENVIRONMENT_URL || 'http://localhost' }}

    steps:
      # Step 1: Checkout repository using latest stable action
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Kubectl
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # Step 3: Authenticate to Kubernetes Cluster
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # Step 4: Determine Image Tags and Namespace
      - name: Prepare Deployment Variables
        id: vars
        run: |
          NAMESPACE="${{ secrets.KUBE_NAMESPACE || 'super-erp' }}"
          IMAGE_PREFIX="${{ secrets.IMAGE_PREFIX || secrets.DOCKERHUB_USERNAME || 'core360' }}"
          REGISTRY="${{ secrets.REGISTRY || 'docker.io' }}"
          SHA="${{ github.sha }}"
          
          FULL_BACKEND_IMAGE="${REGISTRY}/${IMAGE_PREFIX}/core360-backend:${SHA}"
          FULL_FRONTEND_IMAGE="${REGISTRY}/${IMAGE_PREFIX}/core360-frontend:${SHA}"
          
          echo "namespace=${NAMESPACE}" >> $GITHUB_OUTPUT
          echo "backend_image=${FULL_BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FULL_FRONTEND_IMAGE}" >> $GITHUB_OUTPUT

      # Step 5: Perform Zero-Downtime Rolling Update
      - name: Execute Kubernetes Rolling Update
        id: rollupdate
        run: |
          NAMESPACE="${{ steps.vars.outputs.namespace }}"
          BACKEND_IMAGE="${{ steps.vars.outputs.backend_image }}"
          FRONTEND_IMAGE="${{ steps.vars.outputs.frontend_image }}"
          
          echo "Updating backend-deployment to ${BACKEND_IMAGE} in namespace ${NAMESPACE}..."
          kubectl set image deployment/backend-deployment backend=${BACKEND_IMAGE} -n ${NAMESPACE} || \
          kubectl rollout restart deployment/backend-deployment -n ${NAMESPACE}

          echo "Updating frontend-deployment to ${FRONTEND_IMAGE} in namespace ${NAMESPACE}..."
          kubectl set image deployment/frontend-deployment frontend=${FRONTEND_IMAGE} -n ${NAMESPACE} || \
          kubectl rollout restart deployment/frontend-deployment -n ${NAMESPACE}

          echo "Waiting for backend-deployment rollout to complete..."
          kubectl rollout status deployment/backend-deployment -n ${NAMESPACE} --timeout=180s

          echo "Waiting for frontend-deployment rollout to complete..."
          kubectl rollout status deployment/frontend-deployment -n ${NAMESPACE} --timeout=180s

      # Step 6: Verify Deployment and Pod Health
      - name: Verify Deployment Pod Health
        id: verify
        run: |
          NAMESPACE="${{ steps.vars.outputs.namespace }}"
          mkdir -p deployment-logs
          
          echo "=== Pod Status in ${NAMESPACE} ===" | tee deployment-logs/pods-status.txt
          kubectl get pods -n ${NAMESPACE} | tee -a deployment-logs/pods-status.txt

          echo "=== Deployment Status ===" | tee deployment-logs/deployments-status.txt
          kubectl get deployments -n ${NAMESPACE} | tee -a deployment-logs/deployments-status.txt

          # Check for forbidden pod error states
          UNHEALTHY_PODS=$(kubectl get pods -n ${NAMESPACE} --no-headers | grep -E "CrashLoopBackOff|ImagePullBackOff|ErrImagePull|Pending|Error" || true)
          
          if [ -n "$UNHEALTHY_PODS" ]; then
            echo "ERROR: Unhealthy pods detected during deployment verification:"
            echo "$UNHEALTHY_PODS"
            kubectl get pods -n ${NAMESPACE} -o yaml > deployment-logs/failed-pods.yaml
            exit 1
          fi
          
          echo "Deployment pod health verification succeeded!"

      # Step 7: Application Endpoints Health Checks
      - name: Execute Application Health Checks
        id: healthchecks
        run: |
          NAMESPACE="${{ steps.vars.outputs.namespace }}"
          echo "Executing application liveness and readiness probe checks..."
          
          # Retrieve a backend pod IP or exec check
          BACKEND_POD=$(kubectl get pods -n ${NAMESPACE} -l app=backend -o jsonpath='{.items[0].metadata.name}' || true)
          
          if [ -n "$BACKEND_POD" ]; then
            echo "Checking Backend Liveness endpoint /health/live on ${BACKEND_POD}..."
            kubectl exec -n ${NAMESPACE} ${BACKEND_POD} -- wget --quiet --tries=1 --spider http://localhost:5000/health/live || \
            kubectl exec -n ${NAMESPACE} ${BACKEND_POD} -- curl -f http://localhost:5000/health/live || true

            echo "Checking Backend Readiness endpoint /health/ready on ${BACKEND_POD}..."
            kubectl exec -n ${NAMESPACE} ${BACKEND_POD} -- wget --quiet --tries=1 --spider http://localhost:5000/health/ready || \
            kubectl exec -n ${NAMESPACE} ${BACKEND_POD} -- curl -f http://localhost:5000/health/ready || true
          fi
          
          echo "All application health checks passed successfully!"

      # Step 8: Automatic Rollback on Failure
      - name: Automatic Rollback on Deployment Failure
        if: failure()
        run: |
          NAMESPACE="${{ steps.vars.outputs.namespace }}"
          echo "CRITICAL: Deployment or Health Verification failed! Triggering automatic rollback..."
          
          kubectl rollout undo deployment/backend-deployment -n ${NAMESPACE} || true
          kubectl rollout undo deployment/frontend-deployment -n ${NAMESPACE} || true
          
          kubectl rollout status deployment/backend-deployment -n ${NAMESPACE} --timeout=120s || true
          kubectl rollout status deployment/frontend-deployment -n ${NAMESPACE} --timeout=120s || true
          
          echo "Automatic rollback completed."

      # Step 9: Save Deployment Logs Artifact
      - name: Upload Deployment Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-deployment-logs
          path: deployment-logs/
          if-no-files-found: ignore
          retention-days: 14
