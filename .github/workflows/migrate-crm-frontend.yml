name: Migrate CRM frontend module

on:
  push:
    branches:
      - refactor/frontend-crm

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'refactor(frontend): migrate CRM implementation files') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Super-ERP-frontend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move CRM implementation into feature boundaries
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('src')
          moves = {
              'leads': ['LeadsPage.jsx', 'LeadDistributionPage.jsx', 'LeadDetailsPage.jsx'],
              'campaigns': ['CampaignsPage.jsx', 'CampaignFormPage.jsx'],
              'offers': ['OfferDetailPage.jsx'],
              'sales': ['SalesKanbanPage.jsx', 'ExecutiveDashboardPage.jsx'],
              'bookings': ['BookingLookupPage.jsx'],
              'analytics': ['AnalyticsPage.jsx'],
              'tickets': ['TicketsPage.jsx'],
              'email': ['EmailsPage.jsx', 'SentEmailsPage.jsx', 'EmailComposer.jsx'],
          }

          crm_root = root / 'modules' / 'crm' / 'features'
          for feature, filenames in moves.items():
              destination = crm_root / feature
              destination.mkdir(parents=True, exist_ok=True)
              for filename in filenames:
                  source = root / 'pages' / filename
                  target = destination / filename
                  if source.exists() and not target.exists():
                      source.rename(target)

          # CRM-specific supporting UI/helpers.
          support_moves = {
              'OfferHistoryModal.jsx': crm_root / 'offers' / 'components' / 'OfferHistoryModal.jsx',
              'OfferVersionsModal.jsx': crm_root / 'offers' / 'components' / 'OfferVersionsModal.jsx',
              'offerHelpers.js': crm_root / 'offers' / 'utils' / 'offerHelpers.js',
          }
          for filename, target in support_moves.items():
              source = root / ('components' if filename.endswith('.jsx') else 'utils') / filename
              target.parent.mkdir(parents=True, exist_ok=True)
              if source.exists() and not target.exists():
                  source.rename(target)

          # Fix imports for files that moved one level deeper into the module.
          for feature_dir in crm_root.iterdir():
              if not feature_dir.is_dir():
                  continue
              for path in feature_dir.rglob(('*.jsx')):
                  text = path.read_text()
                  text = text.replace("from '../context/", "from '../../../../context/")
                  text = text.replace("from '../services/", "from '../../../../services/")
                  text = text.replace("from '../components/", "from '../../../../components/")
                  text = text.replace("from '../utils/", "from '../../../../utils/")
                  text = text.replace("from '../pages/", "from '../../../../pages/")
                  path.write_text(text)

          # Cross-feature imports created by the CRM split.
          leads_details = crm_root / 'leads' / 'LeadDetailsPage.jsx'
          if leads_details.exists():
              text = leads_details.read_text()
              text = text.replace("from './EmailComposer'", "from '../email/EmailComposer'")
              text = text.replace("from '../../../../components/OfferHistoryModal'", "from '../offers/components/OfferHistoryModal'")
              text = text.replace("from '../../../../components/OfferVersionsModal'", "from '../offers/components/OfferVersionsModal'")
              text = text.replace("from '../../../../utils/offerHelpers'", "from '../offers/utils/offerHelpers'")
              leads_details.write_text(text)

          # Update App.jsx to consume the module-owned pages. Runtime routes stay unchanged.
          app = root / 'App.jsx'
          text = app.read_text()
          import_map = {
              'LeadsPage': 'leads/LeadsPage',
              'LeadDistributionPage': 'leads/LeadDistributionPage',
              'LeadDetailsPage': 'leads/LeadDetailsPage',
              'OfferDetailPage': 'offers/OfferDetailPage',
              'BookingLookupPage': 'bookings/BookingLookupPage',
              'TicketsPage': 'tickets/TicketsPage',
              'AnalyticsPage': 'analytics/AnalyticsPage',
              'SalesKanbanPage': 'sales/SalesKanbanPage',
              'ExecutiveDashboardPage': 'sales/ExecutiveDashboardPage',
              'CampaignsPage': 'campaigns/CampaignsPage',
              'CampaignFormPage': 'campaigns/CampaignFormPage',
              'EmailsPage': 'email/EmailsPage',
              'SentEmailsPage': 'email/SentEmailsPage',
              'EmailComposer': 'email/EmailComposer',
          }
          for name, module_path in import_map.items():
              text = re.sub(
                  rf"import {name} from './pages/{re.escape(name)}';",
                  f"import {name} from './modules/crm/features/{module_path}';",
                  text,
              )
          app.write_text(text)

          # Regenerate the feature indexes from the implementation locations.
          for feature, filenames in moves.items():
              lines = []
              for filename in filenames:
                  export_name = filename.replace('.jsx', '')
                  lines.append(f"export {{ default as {export_name} }} from './{filename}';")
              index = crm_root / feature / 'index.js'
              index.write_text('\n'.join(lines) + '\n')

          # Root CRM index and route module now point at the moved implementations.
          root_index = root / 'modules' / 'crm' / 'index.js'
          root_index.write_text('\n'.join([
              "export * from './features/leads';",
              "export * from './features/campaigns';",
              "export * from './features/offers';",
              "export * from './features/sales';",
              "export * from './features/bookings';",
              "export * from './features/analytics';",
              "export * from './features/tickets';",
              "export * from './features/email';",
              '',
          ]))

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '.'], check=True)
          result = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, check=True)
          if not result.stdout.strip():
              raise SystemExit('CRM migration produced no changes')
          subprocess.run(['git', 'commit', '-m', 'refactor(frontend): migrate CRM implementation files'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refactor/frontend-crm'], check=True)

      - name: Remove one-shot migration workflow
        shell: bash
        run: |
          git rm .github/workflows/migrate-crm-frontend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove one-shot CRM migration workflow'
          git push origin HEAD:refactor/frontend-crm
