name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Super-ERP-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Super-ERP-backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Verify Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Super-ERP-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Super-ERP-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all backend JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run build script (if present)
        run: npm run --if-present build

      - name: Run tests (if present)
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")
          if [ -n "$TEST_SCRIPT" ] && [[ "$TEST_SCRIPT" != *"no test specified"* ]]; then
            npm test
          else
            echo "No custom unit test script specified in package.json. Syntax verification passed."
          fi

      - name: Upload build artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-logs
          path: |
            Super-ERP-backend/dist
            Super-ERP-backend/build
          if-no-files-found: ignore
          retention-days: 7
