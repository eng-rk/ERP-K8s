name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Super-ERP-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Super-ERP-backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Super-ERP-backend

    steps:
      # Step 1: Checkout repository using latest stable action
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 22 LTS environment with npm dependency caching
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Super-ERP-backend/package-lock.json'

      # Step 3: Clean install backend dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run backend build if build script exists in package.json
      - name: Run build script (if present)
        run: npm run --if-present build

      # Step 5: Run backend tests safely if a valid test script exists
      - name: Run tests (if present)
        run: |
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")
          if [ -n "$TEST_SCRIPT" ] && [[ "$TEST_SCRIPT" != *"no test specified"* ]]; then
            npm test
          else
            echo "No custom unit test script specified in package.json. Skipping test step."
          fi

      # Step 6: Upload build artifact / logs
      - name: Upload build artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-logs
          path: |
            Super-ERP-backend/dist
            Super-ERP-backend/build
          if-no-files-found: ignore
          retention-days: 7
